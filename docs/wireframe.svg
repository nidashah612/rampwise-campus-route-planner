<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="560" fill="#fff"/>
  <text x="20" y="26" font-size="16" font-weight="bold">Wireframes: RampWise</text>
  <!-- Mobile -->
  <text x="60" y="54" font-weight="bold">Mobile (default, 1 column)</text>
  <rect x="40" y="62" width="200" height="480" fill="#f6f8f7" stroke="#333"/>
  <rect x="40" y="62" width="200" height="34" fill="#0b5d6b"/><text x="50" y="84" fill="#fff">Route Planner  [nav]</text>
  <rect x="52" y="106" width="176" height="200" fill="#fff" stroke="#888"/>
  <text x="60" y="124">Plan your route</text>
  <rect x="60" y="132" width="160" height="20" fill="none" stroke="#555"/><text x="64" y="146">From [select]</text>
  <rect x="60" y="158" width="160" height="20" fill="none" stroke="#555"/><text x="64" y="172">To [select]</text>
  <rect x="60" y="184" width="160" height="50" fill="none" stroke="#999"/><text x="64" y="200">Needs: [ ] step-free</text><text x="64" y="215">[ ] covered [ ] no steep</text>
  <rect x="60" y="240" width="160" height="20" fill="none" stroke="#555"/><text x="64" y="254">Pace [select]</text>
  <rect x="60" y="270" width="70" height="26" fill="#0b5d6b"/><text x="68" y="287" fill="#fff">Find</text>
  <rect x="52" y="316" width="176" height="110" fill="#fff" stroke="#888"/>
  <text x="60" y="334">Routes (aria-live status)</text>
  <rect x="60" y="342" width="160" height="38" fill="#eef5f0" stroke="#1d6b3a"/><text x="66" y="365">Card: time, badges</text>
  <rect x="60" y="386" width="160" height="32" fill="#fff7f5" stroke="#9a2b1b"/><text x="66" y="406">Closed warning card</text>
  <rect x="52" y="436" width="176" height="90" fill="#fff" stroke="#888"/><text x="60" y="454">Report blocked route</text>
  <rect x="60" y="462" width="160" height="20" fill="none" stroke="#555"/><rect x="60" y="490" width="90" height="26" fill="#0b5d6b"/>
  <!-- Desktop -->
  <text x="330" y="54" font-weight="bold">Desktop (1024px+, sidebar + main)</text>
  <rect x="300" y="62" width="580" height="300" fill="#f6f8f7" stroke="#333"/>
  <rect x="300" y="62" width="580" height="34" fill="#0b5d6b"/><text x="312" y="84" fill="#fff">Accessible Campus Route Planner</text><text x="780" y="84" fill="#fff">Plan  Report  About</text>
  <rect x="312" y="108" width="190" height="160" fill="#fff" stroke="#888"/><text x="320" y="128">Plan form: from, to,</text><text x="320" y="144">needs, pace, distance,</text><text x="320" y="160">sort, [Find] [Clear]</text>
  <rect x="312" y="278" width="190" height="72" fill="#fff" stroke="#888"/><text x="320" y="298">Report blocked route</text>
  <rect x="516" y="108" width="352" height="242" fill="#fff" stroke="#888"/><text x="524" y="128">Routes + status message</text>
  <rect x="524" y="140" width="160" height="70" fill="#eef5f0" stroke="#1d6b3a"/><text x="530" y="160">Card 1</text>
  <rect x="696" y="140" width="160" height="70" fill="#fff7f5" stroke="#9a2b1b"/><text x="702" y="160">Card 2 (closed)</text>
  <text x="300" y="390" font-weight="bold">Tablet (600px+): single column, result cards in 2 columns.</text>
  <text x="300" y="412">Breakpoints: 600px and 1024px. Layout: Flexbox header, Grid page and cards.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
